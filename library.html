<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cinemania - My Library</title>
    <script type="module" crossorigin src="/vanilla-app-template/library.js"></script>
    <link rel="modulepreload" crossorigin href="/vanilla-app-template/assets/vendor-D5rSzIS2.js">
    <link rel="modulepreload" crossorigin href="/vanilla-app-template/assets/tmdb-api-DV4RryLi.js">
    <link rel="stylesheet" crossorigin href="/vanilla-app-template/assets/tmdb-api-Dan3Cczr.css">
  </head>
  <body>
    <header class="header">
  <div class="container header-container">
    <a class="logo" href="./index.html" aria-label="Cinemania home">
      Cinemania
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      MENU
    </button>

    <nav class="desktop-nav" aria-label="Main navigation">
      <ul class="nav-list">
        <li>
          <a class="nav-link" href="./index.html" aria-current="page">
            Home
          </a>
        </li>
        <li>
          <a class="nav-link" href="./catalog.html">Catalog</a>
        </li>
        <li>
          <a class="nav-link" href="./library.html">My Library</a>
        </li>
      </ul>
    </nav>

    <button
      class="theme-toggle"
      type="button"
      aria-label="Light theme"
      aria-pressed="false"
    >
      <span aria-hidden="true">☀</span>
    </button>
  </div>

  <nav
    class="mobile-menu"
    id="mobile-menu"
    aria-label="Mobile navigation"
    hidden
  >
    <button class="menu-close" type="button" aria-label="Close menu">
      <span aria-hidden="true">×</span>
    </button>

    <ul class="mobile-nav-list">
      <li>
        <a class="nav-link" href="./index.html" aria-current="page">
          Home
        </a>
      </li>
      <li>
        <a class="nav-link" href="./catalog.html">Catalog</a>
      </li>
      <li>
        <a class="nav-link" href="./library.html">My Library</a>
      </li>
    </ul>
  </nav>
</header>
    <main>
      <section id="hero" class="hero"></section>

      <section class="library">
        <div class="custom-select" id="genreSelect">
          <button class="custom-select__trigger" type="button">
            <span class="custom-select__title">Genre</span>
            <span class="custom-select__arrow"></span>
          </button>
          <ul class="custom-select__options"></ul>
        </div>
        <ul class="library-list" id="libraryMoviesList"></ul>
      </section>
    </main>
    <footer class="footer">
  <div class="container footer-container">
    <p class="footer-copyright">
      © 2026 | All Rights Reserved |
    </p>

    <p class="footer-credits">
      Developed with
      <span class="footer-heart" role="img" aria-label="love">♥</span>
      by
      <button class="footer-team-button" type="button">
        GoIT Students
      </button>
    </p>
  </div>
</footer>
    <dialog id="movie-modal" class="movie-modal">
  <div class="movie-modal__box">
    <button type="button" class="movie-modal__close" aria-label="Close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path
          d="M18 6L6 18M6 6l12 12"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <img class="movie-modal__poster" id="movie-poster" alt="" />

    <div class="movie-modal__content">
      <h2 class="movie-modal__title" id="movie-title"></h2>

      <ul class="movie-info">
        <li class="movie-info__row">
          <span class="movie-info__label">Vote / Votes</span>
          <span class="movie-info__value">
            <span class="movie-info__badge" id="movie-vote"></span>
            <span class="movie-info__slash">/</span>
            <span class="movie-info__badge" id="movie-votes"></span>
          </span>
        </li>
        <li class="movie-info__row">
          <span class="movie-info__label">Popularity</span>
          <span class="movie-info__value" id="movie-popularity"></span>
        </li>
        <li class="movie-info__row">
          <span class="movie-info__label">Genre</span>
          <span class="movie-info__value" id="movie-genre"></span>
        </li>
      </ul>

      <h3 class="movie-modal__about">ABOUT</h3>
      <p class="movie-modal__overview" id="movie-overview"></p>

      <button type="button" class="movie-modal__library-btn" id="library-btn">
        Add to my library
      </button>
    </div>
  </div>
</dialog>

    <div
  class="loader-overlay"
  id="loader"
  role="status"
  aria-label="Loading"
  hidden
>
  <span class="loader-spinner"></span>
</div>

  </body>
</html>
