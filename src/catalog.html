<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cinemania — Catalog</title>

    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/movie-card.css" />
    <link rel="stylesheet" href="./css/catalog.css" />

    <link rel="icon" type="image/svg+xml" href="./images/svg/popcorn.svg" />
  </head>

  <body class="catalog-page">
    <load src="./partials/header.html" />

    <main>
      <load src="./partials/hero.html" />

      <div class="catalog-section">
        <div class="catalog-container">
          <form class="catalog-search-form" id="catalogSearchForm">
            <div class="catalog-search-wrapper">
              <input
                class="catalog-search-input"
                id="catalogSearchInput"
                type="text"
                name="query"
                placeholder="Search"
                autocomplete="off"
                aria-label="Search movie"
              />

              <button
                class="catalog-clear-btn is-hidden"
                id="catalogClearBtn"
                type="button"
                aria-label="Clear search"
              >
                ×
              </button>
            </div>

            <select
              class="catalog-year-select"
              id="catalogYearSelect"
              name="year"
              aria-label="Select year"
            >
              <option value="">Year</option>
            </select>

            <button
              class="catalog-search-btn"
              type="submit"
              aria-label="Search movies"
            >
              Search
            </button>
          </form>

          <p class="catalog-message" id="catalogMessage" hidden></p>

          <ul class="catalog-list" id="catalogList"></ul>

          <nav
            class="catalog-pagination"
            id="catalogPagination"
            aria-label="Movie pagination"
          ></nav>
        </div>
      </div>
    </main>

    <load src="./partials/footer.html" />
    <load src="./partials/modal.html" />
    <load src="./partials/team-modal.html" />
    <load src="./partials/loader.html" />
    <load src="./partials/scroll-top.html" />

    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/catalog.js"></script>
    <script type="module" src="./js/team-modal.js"></script>
    <script type="module" src="./js/scroll-top.js"></script>
  </body>
</html>
