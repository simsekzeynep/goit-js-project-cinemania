<header class="header">
  <div class="container header-container">
    <a class="logo" href="./index.html" aria-label="Cinemania home">
      <img
        class="logo-icon"
        src="./images/svg/popcorn.svg"
        alt=""
        aria-hidden="true"
      />
      <span class="logo-text">Cinemania</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      MENU
    </button>

    <nav class="desktop-nav" aria-label="Main navigation">
      <ul class="nav-list">
        <li>
          <a class="nav-link" href="./index.html">Home</a>
        </li>
        <li>
          <a class="nav-link" href="./catalog.html">Catalog</a>
        </li>
        <li>
          <a class="nav-link" href="./library.html">My Library</a>
        </li>
      </ul>
    </nav>

    <button
      class="theme-toggle"
      type="button"
      aria-label="Light theme"
      aria-pressed="false"
    >
      <img
        class="theme-toggle-image"
        src="./images/svg/theme-toggle.svg"
        width="60"
        height="24"
        alt=""
        aria-hidden="true"
      />
    </button>
  </div>

  <nav
    class="mobile-menu"
    id="mobile-menu"
    aria-label="Mobile navigation"
    hidden
  >
    <button
      class="menu-close"
      type="button"
      aria-label="Close menu"
    >
      <span aria-hidden="true">×</span>
    </button>

    <ul class="mobile-nav-list">
      <li>
        <a class="nav-link" href="./index.html">Home</a>
      </li>
      <li>
        <a class="nav-link" href="./catalog.html">Catalog</a>
      </li>
      <li>
        <a class="nav-link" href="./library.html">My Library</a>
      </li>
