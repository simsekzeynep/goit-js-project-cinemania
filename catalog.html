<!doctype html>
<html lang="en">

  <body class="catalog-page">
    <header class="header">
  <div class="container header-container">
    <a class="logo" href="./index.html" aria-label="Cinemania home">
      <img
        class="logo-icon"
        src="/vanilla-app-template/assets/popcorn-CULhf2Vt.svg"
        alt=""
        aria-hidden="true"
      />
      <span class="logo-text">Cinemania</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-expanded="false"
      aria-controls="mobile-menu"
    >
      MENU
    </button>

    <nav class="desktop-nav" aria-label="Main navigation">
      <ul class="nav-list">
        <li>
          <a class="nav-link" href="./index.html">Home</a>
        </li>
        <li>
          <a class="nav-link" href="./catalog.html">Catalog</a>
        </li>
        <li>
          <a class="nav-link" href="./library.html">My Library</a>
        </li>
      </ul>
    </nav>

    <button
      class="theme-toggle"
      type="button"
      aria-label="Light theme"
      aria-pressed="false"
    >
      <img
        class="theme-toggle-image"
        src="data:image/svg+xml,%3csvg%20width='60'%20height='24'%20viewBox='0%200%2060%2024'%20fill='none'%20xmlns='http://www.w3.org/2000/svg'%3e%3crect%20width='60'%20height='24'%20rx='12'%20fill='url(%23paint0_linear_4619_13940)'/%3e%3cpath%20d='M18.3518%205.64817C14.8304%202.12677%209.13195%202.11591%205.62393%205.62393C2.11591%209.13195%202.12677%2014.8304%205.64817%2018.3518C9.16958%2021.8732%2014.8681%2021.8841%2018.3761%2018.3761C21.8841%2014.8681%2021.8732%209.16958%2018.3518%205.64817Z'%20fill='white'/%3e%3cpath%20d='M6.82352%206.57422C3.94457%209.65093%203.95538%2014.6508%206.84766%2017.7418'%20stroke='url(%23paint1_linear_4619_13940)'%20stroke-width='1.2'%20stroke-linecap='round'/%3e%3cpath%20d='M49%2017C51.7614%2017%2054%2014.7614%2054%2012C54%209.23858%2051.7614%207%2049%207C46.2386%207%2044%209.23858%2044%2012C44%2014.7614%2046.2386%2017%2049%2017Z'%20stroke='white'%20stroke-linecap='round'%20stroke-linejoin='round'/%3e%3cpath%20d='M53.907%207.093L53.998%207.002M44.002%2016.998L44.093%2016.907M49%205.056V5M49%2019V18.944M42.056%2012H42M56%2012H55.944M44.093%207.093L44.002%207.002M53.998%2016.998L53.907%2016.907'%20stroke='white'%20stroke-width='1.5'%20stroke-linecap='round'%20stroke-linejoin='round'/%3e%3cdefs%3e%3clinearGradient%20id='paint0_linear_4619_13940'%20x1='7.32865'%20y1='1.71488'%20x2='17.73'%20y2='34.0815'%20gradientUnits='userSpaceOnUse'%3e%3cstop%20stop-color='%23FFC226'/%3e%3cstop%20offset='1'%20stop-color='%23F84119'/%3e%3c/linearGradient%3e%3clinearGradient%20id='paint1_linear_4619_13940'%20x1='6.58183'%20y1='7.37218'%20x2='2.77533'%20y2='8.2955'%20gradientUnits='userSpaceOnUse'%3e%3cstop%20stop-color='%23FFC226'/%3e%3cstop%20offset='1'%20stop-color='%23F84119'/%3e%3c/linearGradient%3e%3c/defs%3e%3c/svg%3e"
        width="60"
        height="24"
        alt=""
        aria-hidden="true"
      />
    </button>
  </div>

  <nav
    class="mobile-menu"
    id="mobile-menu"
    aria-label="Mobile navigation"
    hidden
  >
    <button class="menu-close" type="button" aria-label="Close menu">
      <span aria-hidden="true">×</span>
    </button>

    <ul class="mobile-nav-list">
      <li>
        <a class="nav-link" href="./index.html">Home</a>
      </li>
      <li>
        <a class="nav-link" href="./catalog.html">Catalog</a>
      </li>
      <li>
        <a class="nav-link" href="./library.html">My Library</a>
      </li>
    </ul>
  </nav>
</header>


    <main>
      <!-- HERO -->
      <section class="catalog-hero" id="catalogHero">
        <div class="catalog-container">
          <div class="catalog-hero-content" id="catalogHeroContent" hidden>
            <h1 class="catalog-hero-title" id="catalogHeroTitle"></h1>

            <div class="catalog-hero-rating" id="catalogHeroRating"></div>

            <p class="catalog-hero-description" id="catalogHeroDescription"></p>

            <div class="catalog-hero-actions">
              <button
                class="catalog-hero-trailer-btn"
                id="catalogHeroTrailerBtn"
                type="button"
              >
                Watch trailer
              </button>

              <button
                class="catalog-hero-details-btn"
                id="catalogHeroDetailsBtn"
                type="button"
              >
                More details
              </button>
            </div>
          </div>

          <p class="catalog-hero-message" id="catalogHeroMessage" hidden></p>
        </div>
      </section>

      <!-- CATALOG -->
      <section class="catalog-section">
        <div class="catalog-container">
          <!-- SEARCH FORM -->
          <form class="catalog-search-form" id="catalogSearchForm">
            <div class="catalog-search-wrapper">
              <input
                class="catalog-search-input"
                id="catalogSearchInput"
                type="text"
                name="query"
                placeholder="Search"
                autocomplete="off"
                aria-label="Search movie"
              />

              <button
                class="catalog-clear-btn is-hidden"
                id="catalogClearBtn"
                type="button"
                aria-label="Clear search"
              >
                ×
              </button>
            </div>

            <!-- YEAR SELECT -->
            <select
              class="catalog-year-select"
              id="catalogYearSelect"
              name="year"
              aria-label="Select year"
            >
              <option value="">Year</option>
            </select>

            <!-- SEARCH BUTTON -->
            <button
              class="catalog-search-btn"
              type="submit"
              aria-label="Search movies"
            >
              Search
            </button>
          </form>

          <!-- MESSAGE -->
          <p class="catalog-message" id="catalogMessage" hidden></p>

          <!-- MOVIE LIST -->
          <ul class="catalog-list" id="catalogList"></ul>

          <!-- PAGINATION -->
          <div
            class="catalog-pagination"
            id="catalogPagination"
            aria-label="Movie pagination"
          ></div>
        </div>
      </section>
    </main>

    <!-- COMMON PARTIALS -->
    <footer class="footer">
  <div class="container footer-container">
    <p class="footer-copyright">© 2026 | All Rights Reserved |</p>

    <p class="footer-credits">
      Developed with
      <span class="footer-heart" role="img" aria-label="love">♥</span>
      by
      <button class="footer-team-button" type="button">GoIT Students</button>
    </p>
  </div>
</footer>

    <dialog id="movie-modal" class="movie-modal">
  <div class="movie-modal__box">
    <button type="button" class="movie-modal__close" aria-label="Close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path
          d="M18 6L6 18M6 6l12 12"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />
      </svg>
    </button>

    <img class="movie-modal__poster" id="movie-poster" alt="" />

    <div class="movie-modal__content">
      <h2 class="movie-modal__title" id="movie-title"></h2>

      <ul class="movie-info">
        <li class="movie-info__row">
          <span class="movie-info__label">Vote / Votes</span>
          <span class="movie-info__value">
            <span class="movie-info__badge" id="movie-vote"></span>
            <span class="movie-info__slash">/</span>
            <span class="movie-info__badge" id="movie-votes"></span>
          </span>
        </li>
        <li class="movie-info__row">
          <span class="movie-info__label">Popularity</span>
          <span class="movie-info__value" id="movie-popularity"></span>
        </li>
        <li class="movie-info__row">
          <span class="movie-info__label">Genre</span>
          <span class="movie-info__value" id="movie-genre"></span>
        </li>
      </ul>

      <h3 class="movie-modal__about">ABOUT</h3>
      <p class="movie-modal__overview" id="movie-overview"></p>

      <button type="button" class="movie-modal__library-btn" id="library-btn">
        Add to my library
      </button>
    </div>
  </div>
</dialog>

    <div
  class="loader-overlay"
  id="loader"
  role="status"
  aria-label="Loading"
  hidden
>
  <span class="loader-spinner"></span>
</div>

    <button
  type="button"
  id="scroll-top-btn"
  class="scroll-top-btn"
  aria-label="Scroll to top"
>
  <svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      d="M12 19V5M12 5L5 12M12 5L19 12"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</button>


    <!-- SCRIPTS -->
  </body>
</html>
